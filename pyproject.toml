[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-capella-mcp"
version = "0.9.1"
description = "Independent Capella MCP and explicitly enabled native relay"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["capella_groundwork", "relay"]
py-modules = ["development_http", "offline_stdio", "local_bridge", "local_stdio"]
